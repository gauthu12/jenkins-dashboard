<!DOCTYPE html>
<html>
<head>
  <title>Jenkins Self-Healing Dashboard</title>
  <meta http-equiv="refresh" content="10" />
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h2>🛠️ Jenkins Self-Healing Dashboard</h2>
  <table>
    <tr><th>Job</th><th>View</th><th>Status</th><th>Retries</th><th>Last Run</th></tr>
    {% for job in jobs %}
    <tr class="{{ 'fail' if job.status != 'SUCCESS' else 'ok' }}">
      <td>{{ job.job }}</td>
      <td>{{ job.view }}</td>
      <td>{{ job.status }}</td>
      <td>{{ job.retries }}</td>
      <td>{{ job.timestamp }}</td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
